<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAG Chatbot</title>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background-color: #1a1a2e;
            color: #eee;
            height: 100vh;
            overflow: hidden;
        }

        /* ==================== AUTH STYLES ==================== */
        .auth-container {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
        }

        .auth-box {
            background-color: #16213e;
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            border: 1px solid #0f3460;
        }

        .auth-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .auth-header h1 {
            font-size: 28px;
            margin-bottom: 8px;
            color: #e94560;
        }

        .auth-header p {
            color: #888;
            font-size: 14px;
        }

        .auth-divider {
            display: flex;
            align-items: center;
            margin: 24px 0;
            color: #666;
            font-size: 13px;
        }

        .auth-divider::before,
        .auth-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background-color: #0f3460;
        }

        .auth-divider span {
            padding: 0 16px;
        }

        .oauth-buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .oauth-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 14px 20px;
            border: 1px solid #0f3460;
            border-radius: 8px;
            background-color: #1a1a2e;
            color: #eee;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .oauth-btn:hover {
            background-color: #0f3460;
            border-color: #e94560;
        }

        .oauth-btn svg {
            width: 20px;
            height: 20px;
        }

        .oauth-btn.google {
            background-color: #fff;
            color: #333;
        }

        .oauth-btn.google:hover {
            background-color: #f5f5f5;
        }

        .oauth-btn.microsoft {
            background-color: #2f2f2f;
        }

        .oauth-btn.microsoft:hover {
            background-color: #3f3f3f;
        }

        .oauth-btn.apple {
            background-color: #000;
        }

        .oauth-btn.apple:hover {
            background-color: #1a1a1a;
        }

        .email-form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group label {
            font-size: 13px;
            color: #888;
        }

        .form-group input {
            padding: 14px 16px;
            border: 1px solid #0f3460;
            border-radius: 8px;
            background-color: #1a1a2e;
            color: #eee;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-group input:focus {
            border-color: #e94560;
        }

        .auth-submit-btn {
            padding: 14px 20px;
            background-color: #e94560;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .auth-submit-btn:hover {
            background-color: #d63850;
        }

        .auth-submit-btn:disabled {
            background-color: #555;
            cursor: not-allowed;
        }

        .auth-toggle {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #888;
        }

        .auth-toggle a {
            color: #e94560;
            text-decoration: none;
            cursor: pointer;
        }

        .auth-toggle a:hover {
            text-decoration: underline;
        }

        .auth-error {
            background-color: rgba(233, 69, 96, 0.1);
            border: 1px solid #e94560;
            border-radius: 8px;
            padding: 12px;
            color: #e94560;
            font-size: 14px;
            margin-bottom: 16px;
            display: none;
        }

        .auth-success {
            background-color: rgba(46, 204, 113, 0.1);
            border: 1px solid #2ecc71;
            border-radius: 8px;
            padding: 12px;
            color: #2ecc71;
            font-size: 14px;
            margin-bottom: 16px;
            display: none;
        }

        /* ==================== CHAT STYLES ==================== */
        .container {
            display: none;
            height: 100vh;
        }

        .container.active {
            display: flex;
        }

        /* Sidebar */
        .sidebar {
            width: 280px;
            background-color: #16213e;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #0f3460;
        }

        .sidebar-header {
            padding: 16px;
            border-bottom: 1px solid #0f3460;
        }

        .new-chat-btn {
            width: 100%;
            padding: 12px 16px;
            background-color: #0f3460;
            color: #fff;
            border: 1px solid #e94560;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background-color 0.2s;
        }

        .new-chat-btn:hover {
            background-color: #e94560;
        }

        .conversations-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
        }

        .conversation-item {
            padding: 12px 16px;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background-color 0.2s;
        }

        .conversation-item:hover {
            background-color: #0f3460;
        }

        .conversation-item.active {
            background-color: #0f3460;
            border-left: 3px solid #e94560;
        }

        .conversation-title {
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-size: 14px;
        }

        .delete-btn {
            background: none;
            border: none;
            color: #888;
            cursor: pointer;
            padding: 4px;
            opacity: 0;
            transition: opacity 0.2s, color 0.2s;
        }

        .conversation-item:hover .delete-btn {
            opacity: 1;
        }

        .delete-btn:hover {
            color: #e94560;
        }

        /* User section at bottom of sidebar */
        .sidebar-footer {
            padding: 16px;
            border-top: 1px solid #0f3460;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
            overflow: hidden;
        }

        .user-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background-color: #e94560;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 600;
            flex-shrink: 0;
        }

        .user-email {
            font-size: 13px;
            color: #aaa;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .logout-btn {
            background: none;
            border: none;
            color: #888;
            cursor: pointer;
            padding: 8px;
            transition: color 0.2s;
        }

        .logout-btn:hover {
            color: #e94560;
        }

        /* Main Chat Area */
        .main-chat {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: #1a1a2e;
        }

        .chat-header {
            padding: 16px 24px;
            border-bottom: 1px solid #0f3460;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .chat-header h1 {
            font-size: 18px;
            font-weight: 500;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message {
            max-width: 70%;
            padding: 14px 18px;
            border-radius: 16px;
            line-height: 1.5;
            font-size: 15px;
        }

        .message.user {
            background-color: #e94560;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .message.assistant {
            background-color: #0f3460;
            color: #eee;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        .message-content {
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .message-sources {
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid rgba(255,255,255,0.2);
            font-size: 12px;
            color: rgba(255,255,255,0.7);
        }

        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 14px 18px;
            background-color: #0f3460;
            border-radius: 16px;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        .typing-indicator span {
            width: 8px;
            height: 8px;
            background-color: #888;
            border-radius: 50%;
            animation: typing 1.4s infinite ease-in-out;
        }

        .typing-indicator span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-indicator span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typing {
            0%, 60%, 100% {
                transform: translateY(0);
            }
            30% {
                transform: translateY(-6px);
            }
        }

        /* Input Area */
        .input-area {
            padding: 16px 24px;
            border-top: 1px solid #0f3460;
            background-color: #16213e;
        }

        .input-container {
            display: flex;
            gap: 12px;
            max-width: 800px;
            margin: 0 auto;
        }

        .message-input {
            flex: 1;
            padding: 14px 18px;
            border: 1px solid #0f3460;
            border-radius: 24px;
            background-color: #1a1a2e;
            color: #eee;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }

        .message-input:focus {
            border-color: #e94560;
        }

        .message-input::placeholder {
            color: #666;
        }

        .send-btn {
            padding: 14px 24px;
            background-color: #e94560;
            color: white;
            border: none;
            border-radius: 24px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 500;
            transition: background-color 0.2s;
        }

        .send-btn:hover {
            background-color: #d63850;
        }

        .send-btn:disabled {
            background-color: #555;
            cursor: not-allowed;
        }

        /* Empty State */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #666;
            text-align: center;
        }

        .empty-state h2 {
            font-size: 24px;
            margin-bottom: 8px;
            color: #888;
        }

        .empty-state p {
            font-size: 14px;
        }

        /* Scrollbar Styling */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: #1a1a2e;
        }

        ::-webkit-scrollbar-thumb {
            background: #0f3460;
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #e94560;
        }

        /* Loading spinner */
        .loading-spinner {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #1a1a2e;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #0f3460;
            border-top-color: #e94560;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .sidebar {
                width: 60px;
            }

            .sidebar-header, .conversation-title, .user-email {
                display: none;
            }

            .conversation-item {
                justify-content: center;
            }

            .sidebar-footer {
                justify-content: center;
            }

            .user-info {
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <!-- Loading State -->
    <div class="loading-spinner" id="loadingState">
        <div class="spinner"></div>
    </div>

    <!-- Auth Container -->
    <div class="auth-container" id="authContainer" style="display: none;">
        <div class="auth-box">
            <div class="auth-header">
                <h1>RAG Chatbot</h1>
                <p id="authSubtitle">Sign in to continue</p>
            </div>

            <div class="auth-error" id="authError"></div>
            <div class="auth-success" id="authSuccess"></div>

            <!-- OAuth Buttons -->
            <div class="oauth-buttons">
                <button class="oauth-btn google" onclick="signInWithGoogle()">
                    <svg viewBox="0 0 24 24">
                        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                    </svg>
                    Continue with Google
                </button>

                <button class="oauth-btn microsoft" onclick="signInWithMicrosoft()">
                    <svg viewBox="0 0 24 24">
                        <path fill="#F25022" d="M1 1h10v10H1z"/>
                        <path fill="#00A4EF" d="M1 13h10v10H1z"/>
                        <path fill="#7FBA00" d="M13 1h10v10H13z"/>
                        <path fill="#FFB900" d="M13 13h10v10H13z"/>
                    </svg>
                    Continue with Microsoft
                </button>

                <button class="oauth-btn apple" onclick="signInWithApple()">
                    <svg viewBox="0 0 24 24" fill="white">
                        <path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.09l.01-.01zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/>
                    </svg>
                    Continue with Apple
                </button>
            </div>

            <div class="auth-divider"><span>or</span></div>

            <!-- Email Form -->
            <form class="email-form" id="emailForm" onsubmit="handleEmailAuth(event)">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="you@example.com" required>
                </div>
                <div class="form-group" id="passwordGroup">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="••••••••" required minlength="6">
                </div>
                <button type="submit" class="auth-submit-btn" id="authSubmitBtn">Sign In</button>
            </form>

            <div class="auth-toggle">
                <span id="authToggleText">Don't have an account?</span>
                <a onclick="toggleAuthMode()" id="authToggleLink">Sign Up</a>
            </div>
        </div>
    </div>

    <!-- Chat Container -->
    <div class="container" id="chatContainer">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <button class="new-chat-btn" onclick="createNewChat()">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                    New Chat
                </button>
            </div>
            <div class="conversations-list" id="conversationsList">
                <!-- Conversations will be loaded here -->
            </div>
            <div class="sidebar-footer">
                <div class="user-info">
                    <div class="user-avatar" id="userAvatar">U</div>
                    <span class="user-email" id="userEmail">user@example.com</span>
                </div>
                <button class="logout-btn" onclick="signOut()" title="Sign Out">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                        <polyline points="16 17 21 12 16 7"></polyline>
                        <line x1="21" y1="12" x2="9" y2="12"></line>
                    </svg>
                </button>
            </div>
        </aside>

        <!-- Main Chat Area -->
        <main class="main-chat">
            <header class="chat-header">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#e94560" stroke-width="2">
                    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                </svg>
                <h1 id="chatTitle">RAG Chatbot</h1>
            </header>
            
            <div class="chat-messages" id="chatMessages">
                <div class="empty-state" id="emptyState">
                    <h2>Welcome to RAG Chatbot</h2>
                    <p>Start a new conversation or select an existing one</p>
                </div>
            </div>

            <div class="input-area">
                <div class="input-container">
                    <input 
                        type="text" 
                        class="message-input" 
                        id="messageInput" 
                        placeholder="Type your message..." 
                        onkeypress="handleKeyPress(event)"
                    >
                    <button class="send-btn" id="sendBtn" onclick="sendMessage()">Send</button>
                </div>
            </div>
        </main>
    </div>

    <script>
        // ==================== CONFIGURATION ====================
        // IMPORTANT: Replace these with your Supabase project values
        const SUPABASE_URL = 'https://vzfcljadpzpatakcdtji.supabase.co';  // e.g., https://xxxxx.supabase.co
        const SUPABASE_ANON_KEY = 'sb_publishable_KtFgPgO91nI6nyiJSHGYLg_NI7xNEjP';  // Public anon key
        
        // Initialize Supabase client
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // ==================== STATE ====================
        let currentConversationId = null;
        let conversations = [];
        let isLoading = false;
        let isSignUpMode = false;
        let currentSession = null;

        // API Base URL
        const API_BASE = '';

        // ==================== INITIALIZATION ====================
        document.addEventListener('DOMContentLoaded', async () => {
            // Check for existing session
            await checkSession();
            
            // Listen for auth state changes
            supabaseClient.auth.onAuthStateChange(async (event, session) => {
                console.log('Auth event:', event);
                currentSession = session;
                
                if (event === 'SIGNED_IN' && session) {
                    showChatUI(session.user);
                    await loadConversations();
                } else if (event === 'SIGNED_OUT') {
                    showAuthUI();
                }
            });
        });

        async function checkSession() {
            try {
                const { data: { session }, error } = await supabaseClient.auth.getSession();
                
                if (error) throw error;
                
                currentSession = session;
                
                if (session) {
                    showChatUI(session.user);
                    await loadConversations();
                } else {
                    showAuthUI();
                }
            } catch (error) {
                console.error('Error checking session:', error);
                showAuthUI();
            }
        }

        // ==================== UI SWITCHING ====================
        function showAuthUI() {
            document.getElementById('loadingState').style.display = 'none';
            document.getElementById('authContainer').style.display = 'flex';
            document.getElementById('chatContainer').classList.remove('active');
        }

        function showChatUI(user) {
            document.getElementById('loadingState').style.display = 'none';
            document.getElementById('authContainer').style.display = 'none';
            document.getElementById('chatContainer').classList.add('active');
            
            // Update user info in sidebar
            const email = user.email || 'User';
            document.getElementById('userEmail').textContent = email;
            document.getElementById('userAvatar').textContent = email.charAt(0).toUpperCase();
        }

        // ==================== AUTHENTICATION ====================
        async function signInWithGoogle() {
            try {
                const { error } = await supabaseClient.auth.signInWithOAuth({
                    provider: 'google',
                    options: {
                        redirectTo: window.location.origin + '/static/index.html'
                    }
                });
                if (error) throw error;
            } catch (error) {
                showAuthError(error.message);
            }
        }

        async function signInWithMicrosoft() {
            try {
                const { error } = await supabaseClient.auth.signInWithOAuth({
                    provider: 'azure',
                    options: {
                        scopes: 'email',
                        redirectTo: window.location.origin + '/static/index.html'
                    }
                });
                if (error) throw error;
            } catch (error) {
                showAuthError(error.message);
            }
        }

        async function signInWithApple() {
            try {
                const { error } = await supabaseClient.auth.signInWithOAuth({
                    provider: 'apple',
                    options: {
                        redirectTo: window.location.origin + '/static/index.html'
                    }
                });
                if (error) throw error;
            } catch (error) {
                showAuthError(error.message);
            }
        }

        async function handleEmailAuth(event) {
            event.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const submitBtn = document.getElementById('authSubmitBtn');
            
            submitBtn.disabled = true;
            submitBtn.textContent = isSignUpMode ? 'Signing Up...' : 'Signing In...';
            
            try {
                let result;
                
                if (isSignUpMode) {
                    result = await supabaseClient.auth.signUp({
                        email,
                        password,
                        options: {
                            emailRedirectTo: window.location.origin + '/static/index.html'
                        }
                    });
                    
                    if (result.error) throw result.error;
                    
                    // Check if email confirmation is required
                    if (result.data.user && !result.data.session) {
                        showAuthSuccess('Check your email for the confirmation link!');
                        return;
                    }
                } else {
                    result = await supabaseClient.auth.signInWithPassword({
                        email,
                        password
                    });
                    
                    if (result.error) throw result.error;
                }
                
                // Session will be handled by onAuthStateChange
                
            } catch (error) {
                showAuthError(error.message);
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = isSignUpMode ? 'Sign Up' : 'Sign In';
            }
        }

        async function signOut() {
            try {
                const { error } = await supabaseClient.auth.signOut();
                if (error) throw error;
                
                // Clear state
                currentConversationId = null;
                conversations = [];
                currentSession = null;
                
                showAuthUI();
            } catch (error) {
                console.error('Error signing out:', error);
                alert('Failed to sign out');
            }
        }

        function toggleAuthMode() {
            isSignUpMode = !isSignUpMode;
            
            document.getElementById('authSubtitle').textContent = isSignUpMode 
                ? 'Create your account' 
                : 'Sign in to continue';
            document.getElementById('authSubmitBtn').textContent = isSignUpMode ? 'Sign Up' : 'Sign In';
            document.getElementById('authToggleText').textContent = isSignUpMode 
                ? 'Already have an account?' 
                : "Don't have an account?";
            document.getElementById('authToggleLink').textContent = isSignUpMode ? 'Sign In' : 'Sign Up';
            
            // Clear any errors
            hideAuthError();
            hideAuthSuccess();
        }

        function showAuthError(message) {
            const errorEl = document.getElementById('authError');
            errorEl.textContent = message;
            errorEl.style.display = 'block';
            hideAuthSuccess();
        }

        function hideAuthError() {
            document.getElementById('authError').style.display = 'none';
        }

        function showAuthSuccess(message) {
            const successEl = document.getElementById('authSuccess');
            successEl.textContent = message;
            successEl.style.display = 'block';
            hideAuthError();
        }

        function hideAuthSuccess() {
            document.getElementById('authSuccess').style.display = 'none';
        }

        // ==================== API HELPERS ====================
        async function getAuthHeaders() {
            if (!currentSession) {
                const { data: { session } } = await supabaseClient.auth.getSession();
                currentSession = session;
            }
            
            if (!currentSession) {
                throw new Error('Not authenticated');
            }
            
            return {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${currentSession.access_token}`
            };
        }

        async function authenticatedFetch(url, options = {}) {
            try {
                const headers = await getAuthHeaders();
                const response = await fetch(url, {
                    ...options,
                    headers: {
                        ...headers,
                        ...options.headers
                    }
                });
                
                if (response.status === 401) {
                    // Token expired, try to refresh
                    const { data: { session }, error } = await supabaseClient.auth.refreshSession();
                    if (error || !session) {
                        signOut();
                        throw new Error('Session expired. Please sign in again.');
                    }
                    currentSession = session;
                    
                    // Retry the request
                    return fetch(url, {
                        ...options,
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${session.access_token}`,
                            ...options.headers
                        }
                    });
                }
                
                return response;
            } catch (error) {
                console.error('API request failed:', error);
                throw error;
            }
        }

        // ==================== CONVERSATIONS ====================
        async function loadConversations() {
            try {
                const response = await authenticatedFetch(`${API_BASE}/conversations`);
                if (!response.ok) throw new Error('Failed to load conversations');
                
                const data = await response.json();
                conversations = data.conversations || [];
                renderConversationsList();
            } catch (error) {
                console.error('Error loading conversations:', error);
            }
        }

        function renderConversationsList() {
            const list = document.getElementById('conversationsList');
            
            if (conversations.length === 0) {
                list.innerHTML = '<div style="padding: 16px; color: #666; text-align: center; font-size: 13px;">No conversations yet</div>';
                return;
            }

            list.innerHTML = conversations.map(conv => `
                <div class="conversation-item ${conv.id === currentConversationId ? 'active' : ''}" 
                     onclick="selectConversation('${conv.id}')">
                    <span class="conversation-title">${escapeHtml(conv.title || 'New Chat')}</span>
                    <button class="delete-btn" onclick="deleteConversation('${conv.id}', event)" title="Delete">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="3 6 5 6 21 6"></polyline>
                            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                        </svg>
                    </button>
                </div>
            `).join('');
        }

        async function createNewChat() {
            try {
                const response = await authenticatedFetch(`${API_BASE}/conversations`, {
                    method: 'POST',
                    body: JSON.stringify({ title: 'New Chat' })
                });
                
                if (!response.ok) throw new Error('Failed to create conversation');
                
                const newConv = await response.json();
                conversations.unshift(newConv);
                currentConversationId = newConv.id;
                renderConversationsList();
                clearChatArea();
                document.getElementById('chatTitle').textContent = 'New Chat';
                document.getElementById('messageInput').focus();
            } catch (error) {
                console.error('Error creating conversation:', error);
                alert('Failed to create new chat');
            }
        }

        async function selectConversation(conversationId) {
            currentConversationId = conversationId;
            renderConversationsList();
            
            const conv = conversations.find(c => c.id === conversationId);
            document.getElementById('chatTitle').textContent = conv?.title || 'Chat';
            
            await loadMessages(conversationId);
        }

        async function loadMessages(conversationId) {
            try {
                const response = await authenticatedFetch(`${API_BASE}/conversations/${conversationId}/messages`);
                if (!response.ok) throw new Error('Failed to load messages');
                
                const data = await response.json();
                renderMessages(data.messages || []);
            } catch (error) {
                console.error('Error loading messages:', error);
            }
        }

        function renderMessages(messages) {
            const chatArea = document.getElementById('chatMessages');
            const emptyState = document.getElementById('emptyState');
            
            if (messages.length === 0) {
                emptyState.style.display = 'flex';
                chatArea.innerHTML = '';
                chatArea.appendChild(emptyState);
                return;
            }
            
            emptyState.style.display = 'none';
            chatArea.innerHTML = messages.map(msg => createMessageHTML(msg)).join('');
            scrollToBottom();
        }

        function createMessageHTML(msg) {
            const sourcesHTML = msg.sources && msg.sources.length > 0 
                ? `<div class="message-sources">Sources: ${msg.sources.join(', ')}</div>` 
                : '';
            
            return `
                <div class="message ${msg.role}">
                    <div class="message-content">${escapeHtml(msg.content)}</div>
                    ${sourcesHTML}
                </div>
            `;
        }

        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();
            
            if (!message || isLoading) return;
            
            // Create conversation if none selected
            if (!currentConversationId) {
                await createNewChat();
            }
            
            // Add user message to UI
            addMessageToUI({ role: 'user', content: message });
            input.value = '';
            
            // Show typing indicator
            showTypingIndicator();
            isLoading = true;
            updateSendButton();
            
            try {
                const response = await authenticatedFetch(`${API_BASE}/chat`, {
                    method: 'POST',
                    body: JSON.stringify({
                        conversation_id: currentConversationId,
                        message: message
                    })
                });
                
                if (!response.ok) throw new Error('Failed to send message');
                
                const data = await response.json();
                
                // Remove typing indicator
                hideTypingIndicator();
                
                // Add assistant message to UI
                addMessageToUI({ 
                    role: 'assistant', 
                    content: data.answer,
                    sources: data.sources 
                });
                
                // Update title if changed
                if (data.title) {
                    const conv = conversations.find(c => c.id === currentConversationId);
                    if (conv) {
                        conv.title = data.title;
                        document.getElementById('chatTitle').textContent = data.title;
                        renderConversationsList();
                    }
                }
                
            } catch (error) {
                console.error('Error sending message:', error);
                hideTypingIndicator();
                addMessageToUI({ 
                    role: 'assistant', 
                    content: 'Sorry, there was an error processing your request. Please try again.' 
                });
            } finally {
                isLoading = false;
                updateSendButton();
            }
        }

        function addMessageToUI(msg) {
            const chatArea = document.getElementById('chatMessages');
            const emptyState = document.getElementById('emptyState');
            emptyState.style.display = 'none';
            
            const messageDiv = document.createElement('div');
            messageDiv.innerHTML = createMessageHTML(msg);
            chatArea.appendChild(messageDiv.firstElementChild);
            scrollToBottom();
        }

        function showTypingIndicator() {
            const chatArea = document.getElementById('chatMessages');
            const indicator = document.createElement('div');
            indicator.className = 'typing-indicator';
            indicator.id = 'typingIndicator';
            indicator.innerHTML = '<span></span><span></span><span></span>';
            chatArea.appendChild(indicator);
            scrollToBottom();
        }

        function hideTypingIndicator() {
            const indicator = document.getElementById('typingIndicator');
            if (indicator) indicator.remove();
        }

        async function deleteConversation(conversationId, event) {
            event.stopPropagation();
            
            if (!confirm('Delete this conversation?')) return;
            
            try {
                const response = await authenticatedFetch(`${API_BASE}/conversations/${conversationId}`, {
                    method: 'DELETE'
                });
                
                if (!response.ok) throw new Error('Failed to delete conversation');
                
                conversations = conversations.filter(c => c.id !== conversationId);
                
                if (currentConversationId === conversationId) {
                    currentConversationId = null;
                    clearChatArea();
                    document.getElementById('chatTitle').textContent = 'RAG Chatbot';
                }
                
                renderConversationsList();
            } catch (error) {
                console.error('Error deleting conversation:', error);
                alert('Failed to delete conversation');
            }
        }

        function clearChatArea() {
            const chatArea = document.getElementById('chatMessages');
            const emptyState = document.getElementById('emptyState');
            chatArea.innerHTML = '';
            emptyState.style.display = 'flex';
            chatArea.appendChild(emptyState);
        }

        // ==================== UTILITY FUNCTIONS ====================
        function scrollToBottom() {
            const chatArea = document.getElementById('chatMessages');
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        }

        function updateSendButton() {
            const btn = document.getElementById('sendBtn');
            btn.disabled = isLoading;
            btn.textContent = isLoading ? 'Sending...' : 'Send';
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
